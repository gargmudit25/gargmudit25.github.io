<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
            color: #222;
        }

        header {
            padding: 60px 20px;
            background: #222;
            color: white;
        }

        h1 {
            font-size: 40px;
        }

        .box {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Ye meri personal website hai.</p>
    </header>

    <div class="box">
        <h2>About Me</h2>
        <p>
            Hello! Mera naam yahan likho.
            Ye meri pehli website hai.
        </p>

        <button onclick="alert('Hello! 👋')">
            Click Me
        </button>
    </div>

</body>
</html>
